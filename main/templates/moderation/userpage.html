{% extends 'default.html' %}

{% block title %}{{ moderated_user.username }}{% endblock %}

{% block content %}
<div class="main">
    <fieldset>
        <legend><h3>Profile</h3></legend>
        <div>
            <div><a href="/profile/{{ moderated_user.username }}"><img src="/profile/{{ moderated_user.username }}/picture" alt="Profile" class="pfp" style="width: 50px; height: 50px;"/></a></div>
            <div><p>{{ moderated_user.username }}</p></div>
            <div><p>{{ moderated_user.id }}</p></div>
            <div><p>{{ moderated_user.role }}</p></div>
        </div>
    </fieldset>
    <fieldset>
        <legend><h3>Moderation Actions</h3></legend>
        <div>
            <div><a onclick="delete_account({{ moderated_user.id }})" class="danger-button">Delete Account</a></div>
        </div>
    </fieldset>
</div>

<script src="/js/moderation.js"></script>
<script src="/js/common.js"></script>
{% endblock %}
